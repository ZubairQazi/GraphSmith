name: Integrity tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install CPU runtime
        if: runner.os == 'Linux'
        run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install project
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Check integrity and campaign behavior
        run: python -m unittest discover -s tests -v
      - name: Validate example contract
        run: python -m graphsmith validate examples/synthetic-pairs.json
